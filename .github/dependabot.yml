version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      groups:
          minor-and-patch:
              update-types: [minor, patch]
      ignore:
          # sqlite3 v6 crashes on Render (needs GLIBC 2.38). Stay on v5.
          - dependency-name: sqlite3
            update-types: [version-update:semver-major]
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
